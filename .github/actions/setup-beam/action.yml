name: Exact BEAM runtime
description: Install the declared runtime and refuse a different installed version.
inputs:
  elixir-version:
    description: Exact Elixir build for a compatibility lane; defaults to the declaration.
    default: ''
  otp-version:
    description: Exact OTP version for a compatibility lane; defaults to the declaration.
    default: ''
runs:
  using: composite
  steps:
    - name: Read shared toolchains
      id: versions
      shell: bash
      working-directory: ${{ github.workspace }}
      run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{ inputs.elixir-version || steps.versions.outputs.elixir }}
        otp-version: ${{ inputs.otp-version || steps.versions.outputs.otp }}
        version-type: strict
        install-hex: false

    - name: Check installed toolchains
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        EXPECTED_ELIXIR: ${{ inputs.elixir-version || steps.versions.outputs.elixir }}
        EXPECTED_OTP: ${{ inputs.otp-version || steps.versions.outputs.otp }}
      run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"
