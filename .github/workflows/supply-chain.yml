name: Supply chain

# Attests the package that CI's package job built and checked earlier in the same run.
# CI calls this workflow inside every kci/<sha> qualification run. It is reusable so that
# every attestation names it as the signer:
# `gh attestation verify --signer-workflow .../.github/workflows/supply-chain.yml`.
on:
  workflow_call:
    inputs:
      version:
        description: Package version that the package job derived from mix.exs @version.
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  attest:
    name: Attest trusted package
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 42809482079; same keyless download and attestation steps.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download checked package evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bounded-authority-report-adapter-${{ github.sha }}
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/bounded_authority_report_adapter-${{ env.VERSION }}.tar

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/bounded_authority_report_adapter-${{ env.VERSION }}.tar
          sbom-path: artifacts/release.cdx.json
