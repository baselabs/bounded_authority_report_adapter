name: CI

# Every path triggers CI: the doc-sample, docs-currency, Livebook and vocabulary tests read the
# Markdown guides, so a docs-only push is a code change to those tests.
on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Read suite toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44208265114
    outputs:
      beam_matrix: ${{ steps.matrix.outputs.beam_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared toolchains
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - name: Build BEAM matrix
        id: matrix
        env:
          ELIXIR: ${{ steps.versions.outputs.elixir }}
          OTP: ${{ steps.versions.outputs.otp }}
          BEAM_LANES: ${{ steps.versions.outputs.beam_lanes }}
        run: |
          matrix=$(jq -cn \
            --arg elixir "$ELIXIR" \
            --arg otp "$OTP" \
            --argjson lanes "$BEAM_LANES" \
            '{include: ($lanes + [{elixir: $elixir, otp: $otp}])}')
          printf 'beam_matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  gate:
    needs: toolchain
    outputs:
      protocol_identity: ${{ steps.protocol.outputs.identity }}
    name: Gate battery (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # A public repository runs on GitHub-hosted runners only, on a pinned image.
    runs-on: ubuntu-24.04
    timeout-minutes: 12 # run 44208265114

    # Local parity: `mix ci` reproduces these steps step-for-step on the
    # PINNED lane only (asdf .tool-versions, the local floor). The matrix is
    # CI-side breadth: one Linux lane per supported OTP major (the set enforced
    # by config/config.exs: {27..29}; OTP 25/26 are excluded: images
    # exist but the protocol package's codecs decode through :json, which
    # enters stdlib in OTP 27); every cell runs the identical battery.
    # Developer portability (macOS and Linux; Windows developers use WSL2) is
    # a property of the developer setup, not a CI leg.
    # LOCKSTEP: these lanes move together with the mix.exs elixir range, the
    # config assert's set, and .tool-versions.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.beam_matrix) }}

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Verify the resolved protocol dependency
        id: protocol
        run: |
          identity="$(mix run --no-compile --no-deps-check --no-start -r scripts/protocol_dependency.exs -e 'IO.puts(BoundedAuthorityReportAdapter.ProtocolDependency.identity!())')"
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (includes the conformance round-trip)
        run: mix test

      # The gate battery (parity with mix ci, which reproduces these steps
      # step-for-step locally):
      - name: Coverage floor
        run: mix test --cover

      - name: Dialyzer (PLT + analysis under :test so test/support is covered)
        run: mix dialyzer

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

      - name: Check rendered documentation links and anchors
        run: python3 scripts/check_doc_links.py doc

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Package boundary (build + unpack + consumer smoke)
        if: startsWith(steps.protocol.outputs.identity, 'hex:')
        run: mix run --no-start scripts/check_package.exs

      - name: Release reproducibility (two independent builds agree)
        if: startsWith(steps.protocol.outputs.identity, 'hex:')
        run: mix run --no-start scripts/check_reproducible.exs

  example:
    needs: toolchain
    outputs:
      protocol_identity: ${{ steps.protocol.outputs.identity }}
    name: examples/edge_agent (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44208265114

    # Same matrix as the gate job (one Linux lane per supported OTP major):
    # the example app is part of the supported surface (its
    # Bandit/Req pins must hold on every lane).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.beam_matrix) }}

    env:
      MIX_ENV: test

    defaults:
      run:
        # A job's defaults.run replaces the workflow's, so it restates the shell.
        shell: bash
        working-directory: examples/edge_agent

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Audit dependencies
        run: mix hex.audit

      - name: Audit dependency advisories
        run: mix deps.audit

      - name: Verify the resolved protocol dependency
        id: protocol
        run: |
          identity="$(mix run --no-compile --no-deps-check --no-start -r ../../scripts/protocol_dependency.exs -e 'IO.puts(BoundedAuthorityReportAdapter.ProtocolDependency.identity!())')"
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (the end-to-end round-trip + the four rejection classes)
        run: mix test

  livebooks-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44373025522
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-beam
      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force
      - name: Execute every notebook against local dependencies
        run: elixir scripts/check_livebooks.exs --local

  hex-qualification:
    # A protocol Git candidate can pass source checks. Release qualification requires
    # both Mix projects to resolve the same Hex release.
    if: startsWith(needs.gate.outputs.protocol_identity, 'hex:') && needs.gate.outputs.protocol_identity == needs.example.outputs.protocol_identity
    name: Qualify Hex archives
    needs: [gate, example, livebooks-local]
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # No green run yet for this job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-beam

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Qualify the Hex package and documentation
        uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        env:
          HEX_DOCS_SOURCE_REF: ${{ github.sha }}
        with:
          operation: qualify
          package: bounded_authority_report_adapter
          package-directory: .

  package:
    name: Build checked release package evidence
    needs: hex-qualification
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # No green run yet for the archive handoff.
    outputs:
      version: ${{ steps.archive.outputs.version }}
    # This job runs project code with read-only permissions and no signing identity.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-beam

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Test local identifier hooks
        run: |
          command -v python3 >/dev/null
          command -v git >/dev/null
          mix privacy.hooks

      # Use the Actions API to read the completed qualification job's artifact in this run.
      - name: Download the exact archive for package checks and attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hex-hexpm-bounded_authority_report_adapter
          path: ${{ runner.temp }}/qualified-hex
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Name the archive using the qualified version
        id: archive
        run: |
          VERSION="$(jq -er .version "$RUNNER_TEMP/qualified-hex/qualified.json")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp "$RUNNER_TEMP/qualified-hex/package.tar" "artifacts/bounded_authority_report_adapter-$VERSION.tar"

      - name: Check the archive used for attestation
        run: mix run --no-start scripts/check_package.exs "artifacts/bounded_authority_report_adapter-$VERSION.tar"

      - name: Record archive checksum
        working-directory: artifacts
        run: |
          sha256sum "bounded_authority_report_adapter-$VERSION.tar" > SHA256SUMS
          expected="$(jq -er .package_sha256 "$RUNNER_TEMP/qualified-hex/qualified.json")"
          test "$(cut -d' ' -f1 SHA256SUMS)" = "$expected"

      - name: Generate CycloneDX SBOM
        run: mix sbom.generate
        env:
          MIX_ENV: test

      - name: Upload CI package evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-authority-report-adapter-${{ github.sha }}
          path: |
            artifacts/bounded_authority_report_adapter-${{ env.VERSION }}.tar
            artifacts/release.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Remove downloaded qualification archives
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/qualified-hex"

  attest:
    name: Supply chain
    needs: [gate, example, livebooks-local, package]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/supply-chain.yml
    with:
      version: ${{ needs.package.outputs.version }}

  qualified:
    if: always()
    needs: [toolchain, gate, example, livebooks-local, hex-qualification, package, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44208265114
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PYTHON
