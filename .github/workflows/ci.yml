name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Format · Compile · Credo · Test · Cover · Dialyzer · Docs · Audits
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29'

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (includes the conformance round-trip)
        run: mix test

      # The gate battery (parity with mix ci, which reproduces these steps
      # step-for-step locally):
      - name: Coverage floor
        run: mix test --cover

      - name: Dialyzer (PLT + analysis under :test so test/support is covered)
        run: mix dialyzer

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Package boundary (build + unpack + consumer smoke)
        run: mix run --no-start scripts/check_package.exs

  example:
    name: examples/edge_agent (Audit · Format · Compile · Credo · Test)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    defaults:
      run:
        working-directory: examples/edge_agent

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29'

      - name: Install deps
        run: mix deps.get

      - name: Audit dependencies
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (the end-to-end round-trip + the four rejection classes)
        run: mix test
