name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate battery (${{ matrix.os }} — Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ${{ matrix.os }}

    # Local parity: `mix ci` reproduces these steps step-for-step on the
    # PINNED lane only (asdf .tool-versions — the local floor; Linux/macOS —
    # the OS dimension is CI-side, like checkout/setup-beam). The matrix is
    # CI-side breadth: one lane per supported OTP major (the set enforced by
    # config/config.exs, ADR-0019 — {27..29}; OTP 25/26 are excluded: images
    # exist but the protocol package's codecs decode through :json, which
    # enters stdlib in OTP 27) plus a windows-latest lane on the pinned
    # versions (owner standard, 2026-09-16: clone → build → test must hold on
    # Windows too); every cell runs the identical battery.
    # LOCKSTEP: these lanes move together with the mix.exs elixir range, the
    # config assert's set, and .tool-versions.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.18.4"
            otp: "27.3.4.14"
          - os: ubuntu-latest
            elixir: "1.19.5"
            otp: "28.5.0.3"
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0.3"
          - os: windows-latest
            elixir: "1.20.2"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install deps
        run: mix deps.get

      - name: Check dependency currency (latest-first)
        run: bash scripts/check-deps-currency.sh

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (includes the conformance round-trip)
        run: mix test

      # The gate battery (parity with mix ci, which reproduces these steps
      # step-for-step locally):
      - name: Coverage floor
        run: mix test --cover

      - name: Dialyzer (PLT + analysis under :test so test/support is covered)
        run: mix dialyzer

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Package boundary (build + unpack + consumer smoke)
        run: mix run --no-start scripts/check_package.exs

      - name: Release reproducibility (two independent builds agree)
        run: mix run --no-start scripts/check_reproducible.exs

  example:
    name: examples/edge_agent (${{ matrix.os }} — Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ${{ matrix.os }}

    # Same four-lane matrix as the gate job (one lane per supported OTP
    # major, ADR-0019, plus the windows-latest lane on the pinned versions):
    # the example app is part of the supported surface (its Bandit/Req pins
    # must hold on every lane).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.18.4"
            otp: "27.3.4.14"
          - os: ubuntu-latest
            elixir: "1.19.5"
            otp: "28.5.0.3"
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0.3"
          - os: windows-latest
            elixir: "1.20.2"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    defaults:
      run:
        working-directory: examples/edge_agent

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install deps
        run: mix deps.get

      - name: Check dependency currency (latest-first)
        run: bash ../../scripts/check-deps-currency.sh

      - name: Audit dependencies
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (the end-to-end round-trip + the four rejection classes)
        run: mix test
