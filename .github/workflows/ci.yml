name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*', '.github/ISSUE_TEMPLATE/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate battery (${{ matrix.os }} — Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ${{ matrix.os }}

    # Local parity: `mix ci` reproduces these steps step-for-step on the
    # PINNED lane only (asdf .tool-versions, the local floor). The matrix is
    # CI-side breadth: one Linux lane per supported OTP major (the set enforced
    # by config/config.exs, ADR-0019: {27..29}; OTP 25/26 are excluded: images
    # exist but the protocol package's codecs decode through :json, which
    # enters stdlib in OTP 27); every cell runs the identical battery.
    # Developer portability (macOS and Linux; Windows developers use WSL2) is
    # a property of the developer setup, not a CI leg.
    # LOCKSTEP: these lanes move together with the mix.exs elixir range, the
    # config assert's set, and .tool-versions.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.18.4"
            otp: "27.3.4.14"
          - os: ubuntu-latest
            elixir: "1.19.5"
            otp: "28.5.0.3"
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # dialyzer's PLTs (_build/plts, mix.exs): rebuilt from scratch on every run without this.
      - name: Cache dialyzer PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/plts
          key: plt-${{ runner.os }}-${{ runner.arch }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ runner.arch }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (includes the conformance round-trip)
        run: mix test

      # The gate battery (parity with mix ci, which reproduces these steps
      # step-for-step locally):
      - name: Coverage floor
        run: mix test --cover

      - name: Dialyzer (PLT + analysis under :test so test/support is covered)
        run: mix dialyzer

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Package boundary (build + unpack + consumer smoke)
        run: mix run --no-start scripts/check_package.exs

      - name: Release reproducibility (two independent builds agree)
        run: mix run --no-start scripts/check_reproducible.exs

  example:
    name: examples/edge_agent (${{ matrix.os }} — Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ${{ matrix.os }}

    # Same matrix as the gate job (one Linux lane per supported OTP major,
    # ADR-0019): the example app is part of the supported surface (its
    # Bandit/Req pins must hold on every lane).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.18.4"
            otp: "27.3.4.14"
          - os: ubuntu-latest
            elixir: "1.19.5"
            otp: "28.5.0.3"
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0.3"

    env:
      MIX_ENV: test

    defaults:
      run:
        working-directory: examples/edge_agent

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install deps
        run: mix deps.get

      - name: Audit dependencies
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (the end-to-end round-trip + the four rejection classes)
        run: mix test
