name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Format · Compile · Credo · Test
    runs-on: ubuntu-latest

    env:
      # Let mix deps.get clone the private bounded_authority_protocol dep via the
      # action's GITHUB_TOKEN (same org, read access). For cross-org or external
      # consumers, replace with a PAT or deploy key stored as a secret.
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29'

      - name: Configure git for private deps
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (includes the conformance round-trip)
        run: mix test
