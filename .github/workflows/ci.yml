name: CI

# Every path triggers CI: the doc-sample, docs-currency, Livebook and vocabulary tests read the
# Markdown guides, so a docs-only push is a code change to those tests.
on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Read suite toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44208265114
    outputs:
      lanes: ${{ steps.versions.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read every declared lane from .tool-versions
        id: versions
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          versions = {}
          for line in pathlib.Path('.tool-versions').read_text().splitlines():
              fields = line.split('#', 1)[0].split()
              if fields:
                  if len(fields) < 2 or fields[0] in versions:
                      raise SystemExit('Invalid or duplicate toolchain declaration')
                  versions[fields[0]] = fields[1:]
          lanes = []
          for elixir in versions['elixir']:
              match = re.fullmatch(r'(\d+\.\d+\.\d+)-otp-(\d+)', elixir)
              if not match:
                  raise SystemExit('Declare an exact Elixir build')
              matches = [otp for otp in versions['erlang'] if otp.split('.')[0] == match[2]]
              if len(matches) != 1:
                  raise SystemExit('Each Elixir build requires exactly one declared OTP version')
              lanes.append({'elixir': elixir, 'otp': matches[0]})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('lanes=' + json.dumps(lanes) + '\n')
          PYTHON

  gate:
    needs: toolchain
    name: Gate battery (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    # A public repository runs on GitHub-hosted runners only, on a pinned image.
    runs-on: ubuntu-24.04
    timeout-minutes: 12 # run 44208265114

    # Local parity: `mix ci` reproduces these steps step-for-step on the
    # PINNED lane only (asdf .tool-versions, the local floor). The matrix is
    # CI-side breadth: one Linux lane per supported OTP major (the set enforced
    # by config/config.exs: {27..29}; OTP 25/26 are excluded: images
    # exist but the protocol package's codecs decode through :json, which
    # enters stdlib in OTP 27); every cell runs the identical battery.
    # Developer portability (macOS and Linux; Windows developers use WSL2) is
    # a property of the developer setup, not a CI leg.
    # LOCKSTEP: these lanes move together with the mix.exs elixir range, the
    # config assert's set, and .tool-versions.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.toolchain.outputs.lanes) }}

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Pin the Hex client
        # The Hex version is written into the archive metadata; .hex-version keeps CI, the
        # attestation and a local release build on the same client.
        run: |
          hex_version="$(cat .hex-version)"
          mix local.hex "$hex_version" --force

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (includes the conformance round-trip)
        run: mix test

      # The gate battery (parity with mix ci, which reproduces these steps
      # step-for-step locally):
      - name: Coverage floor
        run: mix test --cover

      - name: Dialyzer (PLT + analysis under :test so test/support is covered)
        run: mix dialyzer

      - name: Docs (warnings as errors)
        run: mix docs --warnings-as-errors

      - name: Check rendered documentation links and anchors
        run: python3 scripts/check_doc_links.py doc

      - name: Audit dependencies (retirements)
        run: mix hex.audit

      - name: Audit dependencies (security advisories)
        run: mix deps.audit

      - name: Package boundary (build + unpack + consumer smoke)
        run: mix run --no-start scripts/check_package.exs

      - name: Release reproducibility (two independent builds agree)
        run: mix run --no-start scripts/check_reproducible.exs

  example:
    needs: toolchain
    name: examples/edge_agent (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44208265114

    # Same matrix as the gate job (one Linux lane per supported OTP major):
    # the example app is part of the supported surface (its
    # Bandit/Req pins must hold on every lane).
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.toolchain.outputs.lanes) }}

    env:
      MIX_ENV: test

    defaults:
      run:
        # A job's defaults.run replaces the workflow's, so it restates the shell.
        shell: bash
        working-directory: examples/edge_agent

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install deps
        run: mix deps.get --check-locked

      - name: Audit dependencies
        run: mix hex.audit

      - name: Audit dependency advisories
        run: mix deps.audit

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Lint (credo)
        run: mix credo --strict

      - name: Test (the end-to-end round-trip + the four rejection classes)
        run: mix test

  livebooks-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44373025522
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-beam
      - name: Pin the Hex client
        run: |
          hex_version="$(cat .hex-version)"
          mix local.hex "$hex_version" --force
      - name: Execute every notebook against local dependencies
        run: elixir scripts/check_livebooks.exs --local

  package:
    name: Build checked release package evidence
    needs: [gate, example, livebooks-local]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44373025522
    outputs:
      version: ${{ steps.archive.outputs.version }}
    # This job runs project code with read-only permissions and no signing identity.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-beam

      - name: Pin the Hex client
        run: |
          hex_version="$(cat .hex-version)"
          mix local.hex "$hex_version" --force

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Test local identifier hooks
        run: |
          command -v python3 >/dev/null
          command -v git >/dev/null
          mix privacy.hooks

      - name: Build exact unpublished archive
        id: archive
        run: |
          VERSION="$(grep -m1 '@version ' mix.exs | sed -E 's/.*@version "([^"]+)".*/\1/')"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          mix hex.build --output "artifacts/bounded_authority_report_adapter-$VERSION.tar"

      - name: Check the archive used for attestation
        run: mix run --no-start scripts/check_package.exs "artifacts/bounded_authority_report_adapter-$VERSION.tar"

      - name: Record archive checksum
        working-directory: artifacts
        run: sha256sum "bounded_authority_report_adapter-$VERSION.tar" > SHA256SUMS

      - name: Generate CycloneDX SBOM
        run: mix sbom.generate
        env:
          MIX_ENV: test

      - name: Upload CI package evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-authority-report-adapter-${{ github.sha }}
          path: |
            artifacts/bounded_authority_report_adapter-${{ env.VERSION }}.tar
            artifacts/release.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Supply chain
    needs: [gate, example, livebooks-local, package]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/supply-chain.yml
    with:
      version: ${{ needs.package.outputs.version }}

  qualified:
    if: always()
    needs: [toolchain, gate, example, livebooks-local, package, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44208265114
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PYTHON
