name: Publish to Hex.pm

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Qualified release commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      qualification_run:
        description: Original CI run ID when retrying publication
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify-provenance:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # No green run yet.
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      qualification-run: ${{ steps.qualification.outputs.run }}
      package-sha256: ${{ steps.provenance.outputs.package-sha256 }}
      elixir: ${{ steps.toolchain.outputs.elixir }}
      otp: ${{ steps.toolchain.outputs.otp }}
    steps:
      - name: Require a default-branch dispatch and a full release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release ancestry and select the qualification run
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: |
          git merge-base --is-ancestor "$RELEASE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH"
          if [ -z "$QUALIFICATION_RUN" ]; then
            runs="$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_COMMIT&status=success&per_page=100")"
            QUALIFICATION_RUN="$(jq -er --arg sha "$RELEASE_COMMIT" '
              [.[].workflow_runs[] | select(.head_sha == $sha and .head_branch == ("kci/" + $sha)
                and .event == "push" and .conclusion == "success")]
              | max_by([.run_started_at, .id]).id
            ' <<< "$runs")"
          fi
          [[ "$QUALIFICATION_RUN" =~ ^[1-9][0-9]*$ ]]
          printf 'run=%s\n' "$QUALIFICATION_RUN" >> "$GITHUB_OUTPUT"
      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - name: Download qualified Hex archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hex-hexpm-bounded_authority_report_adapter
          path: ${{ runner.temp }}/qualified-hex
          github-token: ${{ github.token }}
          run-id: ${{ steps.qualification.outputs.run }}
          digest-mismatch: error
      - name: Download package attestation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bounded-authority-report-adapter-${{ inputs.release_commit }}
          path: ${{ runner.temp }}/qualification-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.qualification.outputs.run }}
          digest-mismatch: error
      - name: Verify the qualified package attestation and refuse existing version tags
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          VERSION="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]]
          version_tags="$(git tag --list "v$VERSION" "$VERSION")"
          test -z "$version_tags"
          archive="$RUNNER_TEMP/qualified-hex/package.tar"
          evidence="$RUNNER_TEMP/qualification-evidence"
          cmp "$archive" "$evidence/bounded_authority_report_adapter-$VERSION.tar"
          (cd "$evidence" && sha256sum --check SHA256SUMS)
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml" \
            --source-digest "$RELEASE_COMMIT" --deny-self-hosted-runners
          package_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          printf 'package-sha256=%s\n' "$package_sha" >> "$GITHUB_OUTPUT"
      - name: Remove qualification downloads
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/qualified-hex" "$RUNNER_TEMP/qualification-evidence"

  upload:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    needs: verify-provenance
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # No green run yet.
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      qualification-run: ${{ steps.upload.outputs.qualification-run }}
      qualification-sha256: ${{ steps.upload.outputs.qualification-sha256 }}
      package-sha256: ${{ steps.upload.outputs.package-sha256 }}
      version: ${{ steps.upload.outputs.version }}
    steps:
      - name: Require a default-branch dispatch and a full release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ needs.verify-provenance.outputs.elixir }}
          otp-version: ${{ needs.verify-provenance.outputs.otp }}
          install-hex: false
          install-rebar: false
      - name: Refuse BEAM runtime drift
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ needs.verify-provenance.outputs.elixir }}
          EXPECTED_OTP: ${{ needs.verify-provenance.outputs.otp }}
        run: |
          test ! -e mix.exs
          elixir_version="$(elixir -e 'IO.write(System.version() <> "-otp-" <> System.build_info()[:otp_release])')"
          otp_version="$(erl -noshell -noinput -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')"
          test "$elixir_version" = "$EXPECTED_ELIXIR"
          test "$otp_version" = "$EXPECTED_OTP"
      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/3bfbb84692a65b4d2c03dc3b7932353026fe6943/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force
      - name: Upload qualified Hex archives
        id: upload
        uses: baselabs/.github/.github/actions/hex-publish@3bfbb84692a65b4d2c03dc3b7932353026fe6943
        with:
          operation: upload
          package: bounded_authority_report_adapter
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.verify-provenance.outputs.qualification-run }}
          organization-read-key: ${{ secrets.HEX_ORG_KEY_PUBLISH_API_READ }}

  read-back:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    needs: [verify-provenance, upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # No green run yet.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ needs.verify-provenance.outputs.elixir }}
          otp-version: ${{ needs.verify-provenance.outputs.otp }}
          install-hex: false
          install-rebar: false
      - name: Refuse BEAM runtime drift
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ needs.verify-provenance.outputs.elixir }}
          EXPECTED_OTP: ${{ needs.verify-provenance.outputs.otp }}
        run: |
          test ! -e mix.exs
          elixir_version="$(elixir -e 'IO.write(System.version() <> "-otp-" <> System.build_info()[:otp_release])')"
          otp_version="$(erl -noshell -noinput -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')"
          test "$elixir_version" = "$EXPECTED_ELIXIR"
          test "$otp_version" = "$EXPECTED_OTP"
      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/3bfbb84692a65b4d2c03dc3b7932353026fe6943/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force
      - name: Verify served Hex archives
        id: served
        uses: baselabs/.github/.github/actions/hex-publish@3bfbb84692a65b4d2c03dc3b7932353026fe6943
        with:
          operation: read-back
          package: bounded_authority_report_adapter
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.upload.outputs.qualification-run }}
          qualification-sha256: ${{ needs.upload.outputs.qualification-sha256 }}
          release-assets-directory: ${{ runner.temp }}/release-assets
      - name: Download package attestation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bounded-authority-report-adapter-${{ steps.served.outputs.commit }}
          path: ${{ runner.temp }}/qualification-evidence
          github-token: ${{ github.token }}
          run-id: ${{ needs.upload.outputs.qualification-run }}
          digest-mismatch: error
      - name: Match the served release to qualification evidence
        env:
          VERSION: ${{ needs.upload.outputs.version }}
          ATTESTED_SHA256: ${{ needs.verify-provenance.outputs.package-sha256 }}
          UPLOADED_SHA256: ${{ needs.upload.outputs.package-sha256 }}
        run: |
          [[ "$ATTESTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$ATTESTED_SHA256" = "$UPLOADED_SHA256"
          assets="$RUNNER_TEMP/release-assets"
          evidence="$RUNNER_TEMP/qualification-evidence"
          cmp "$assets/bounded_authority_report_adapter-$VERSION.tar" "$evidence/bounded_authority_report_adapter-$VERSION.tar"
          (cd "$evidence" && sha256sum --check SHA256SUMS)
          (
            cd "$assets"
            sha256sum --check SHA256SUMS
            printf '%s  %s\n' "$ATTESTED_SHA256" "bounded_authority_report_adapter-$VERSION.tar" | sha256sum --check
            cp "$evidence"/release.cdx.json .
          )
      - name: Upload the consumer release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
      - name: Remove publication downloads
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/qualification-evidence"

  published-livebooks:
    needs: read-back
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; green 1.0 min, run 44619032017.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false

      - uses: ./.github/actions/setup-beam

      - name: Pin the Hex client
        run: |
          hex_version="$(cat .hex-version)"
          mix local.hex "$hex_version" --force

      - name: Wait until the Hex repository serves the release
        run: |
          version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          test -n "$version"
          tarball="https://repo.hex.pm/tarballs/bounded_authority_report_adapter-${version}.tar"
          for ((attempt = 1; attempt <= 12; attempt++)); do
            if curl -fsSIo /dev/null "$tarball"; then exit 0; fi
            sleep 10
          done
          echo "::error::Hex did not serve ${tarball} within two minutes of read-back"
          exit 1

      - name: Execute every notebook unchanged against the published release
        run: elixir scripts/check_livebooks.exs --published
