name: Publish to Hex.pm

# Maintainers dispatch from the qualified default-branch head. Publication resumes
# held uploads on the same commit; only a complete byte-exact read-back succeeds.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Publication must be dispatched from the default branch." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a package name the registry has never had
        env:
          PACKAGE: bounded_authority_report_adapter
        run: python3 scripts/check_hex_release.py name

      - uses: ./.github/actions/setup-beam

      - name: Pin the Hex client
        run: |
          hex_version="$(cat .hex-version)"
          mix local.hex "$hex_version" --force

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Read the package identity
        run: |
          mkdir -p artifacts
          mix run --no-start -e '
            config = Mix.Project.config()
            package = to_string(Keyword.get(config[:package] || [], :name, config[:app]))
            version = config[:version]
            Version.parse!(version)
            File.write!(System.fetch_env!("GITHUB_ENV"),
              "PACKAGE=#{package}\nVERSION=#{version}\n" <>
              "PACKAGE_ARCHIVE=#{System.fetch_env!("GITHUB_WORKSPACE")}/artifacts/#{package}-#{version}.tar\n" <>
              "DOCS_ARCHIVE=#{System.fetch_env!("RUNNER_TEMP")}/hex-docs.tar.gz\n", [:append])
          '

      - name: Refuse an existing version tag
        run: |
          tags="$(git ls-remote --tags origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" \
            "refs/tags/$VERSION" "refs/tags/$VERSION^{}")"
          if [ -n "$tags" ]; then
            echo "::error::Tag for $VERSION already exists on origin."
            exit 1
          fi

      - name: Build documentation
        run: |
          mix docs --warnings-as-errors --formatter html
          test -s doc/index.html
          tar -C doc --format=gnu --sort=name --mtime='2000-01-01 00:00Z' \
            --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' -cf - . \
            | gzip -n > "$DOCS_ARCHIVE"
          tar -tzf "$DOCS_ARCHIVE" > /dev/null

      - name: Build the package archive
        run: mix hex.build --output "$PACKAGE_ARCHIVE"

      - name: Check package identity, exact files and a consumer build
        run: mix run --no-start scripts/check_package.exs "$PACKAGE_ARCHIVE"

      - name: Verify the built archive against qualification and collect its SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$PACKAGE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/supply-chain.yml" \
            --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          artifact_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f "name=bounded-authority-report-adapter-$GITHUB_SHA" \
            --jq '.artifacts | map(select(.expired == false)) | max_by(.id) | .id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "::error::Qualification evidence is missing or expired."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$RUNNER_TEMP/qualification-evidence.zip"
          unzip -q "$RUNNER_TEMP/qualification-evidence.zip" -d "$RUNNER_TEMP/qualification-evidence"
          cmp "$PACKAGE_ARCHIVE" "$RUNNER_TEMP/qualification-evidence/$PACKAGE-$VERSION.tar"
          cp "$RUNNER_TEMP/qualification-evidence/SHA256SUMS" artifacts/
          cp "$RUNNER_TEMP/qualification-evidence/release.cdx.json" artifacts/
          (cd artifacts && sha256sum --check SHA256SUMS)

      - name: Prepare upload and inspect any existing release bytes
        run: |
          sha256sum "$PACKAGE_ARCHIVE" "$DOCS_ARCHIVE" > "$RUNNER_TEMP/hex-publish.sha256"
          python3 scripts/check_hex_release.py prepare

      - name: Upload the consumer release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            artifacts/bounded_authority_report_adapter-${{ env.VERSION }}.tar
            artifacts/SHA256SUMS
            artifacts/release.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload only the missing inspected package and documentation
        id: upload
        working-directory: ${{ runner.temp }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY"
          test ! -e mix.exs
          sha256sum --check "$RUNNER_TEMP/hex-publish.sha256"
          mix run --no-mix-exs --no-start "$GITHUB_WORKSPACE/scripts/publish_hex_artifacts.exs" \
            "$PACKAGE" "$VERSION" "$PACKAGE_ARCHIVE" "$DOCS_ARCHIVE"

      - name: Read back both uploads and refuse a held or differing release
        env:
          PUBLICATION_HELD: ${{ steps.upload.outputs.held }}
        run: python3 scripts/check_hex_release.py read-back

      - name: Remove publication scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/qualification-evidence"
          rm -f "$RUNNER_TEMP/qualification-evidence.zip" "$RUNNER_TEMP/hex-publish.sha256" \
            "$RUNNER_TEMP/hex-docs.tar.gz"

  # Qualification never installs this package from Hex: a version commit names a version Hex
  # does not serve yet. The published release is checked here, after the upload, in a job with
  # no environment and no secrets, so project and dependency code never share the keyed job.
  published-livebooks:
    needs: publish
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # no green run yet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam

      - name: Pin the Hex client
        run: |
          hex_version="$(cat .hex-version)"
          mix local.hex "$hex_version" --force

      - name: Wait until the Hex repository serves the release
        run: |
          version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          test -n "$version"
          tarball="https://repo.hex.pm/tarballs/bounded_authority_report_adapter-${version}.tar"
          for ((attempt = 1; attempt <= 60; attempt++)); do
            if curl -fsSIo /dev/null "$tarball"; then exit 0; fi
            sleep 10
          done
          echo "::error::Hex did not serve ${tarball} within ten minutes of publication"
          exit 1

      - name: Execute every notebook unchanged against the published release
        run: elixir scripts/check_livebooks.exs --published
